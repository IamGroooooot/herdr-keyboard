id = "herdr-keyboard"
name = "Mobile Keyboard"
version = "0.4.7"
min_herdr_version = "0.9.0"
description = "Send hard-to-type key combinations from a mobile keyboard"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["npm", "ci"]

[[build]]
command = ["npm", "run", "build"]

[[actions]]
id = "open"
title = "Keyboard: Choose shortcut"
contexts = ["pane"]
command = ["./dist/launch.cmd", "open"]

[[panes]]
id = "picker"
title = "Mobile Keyboard"
platforms = ["linux", "macos"]
placement = "popup"
width = "90%"
height = "80%"
command = ["./dist/launch.cmd"]

# Windows PTYs need an explicit command interpreter for batch files.
[[panes]]
id = "picker-windows"
title = "Mobile Keyboard"
platforms = ["windows"]
placement = "popup"
width = "90%"
height = "80%"
command = ["cmd.exe", "/d", "/c", ".\\dist\\launch.cmd"]

[[actions]]
id = "opt-up"
title = "Keyboard: Alt + Up"
contexts = ["pane"]
command = ["./dist/launch.cmd", "send", "alt+up"]

[[actions]]
id = "shift-tab"
title = "Keyboard: Shift + Tab"
contexts = ["pane"]
command = ["./dist/launch.cmd", "send", "shift+tab"]

[[actions]]
id = "shift-up"
title = "Keyboard: Shift + Up"
contexts = ["pane"]
command = ["./dist/launch.cmd", "send", "shift+up"]
