id = "herdr-keyboard"
name = "Mobile Keyboard"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Send hard-to-type key combinations from a mobile keyboard"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "opt-down"
title = "Keyboard: Opt + Down"
contexts = ["pane"]
command = ["node", "keyboard.mjs", "alt+down"]

[[actions]]
id = "shift-tab"
title = "Keyboard: Shift + Tab"
contexts = ["pane"]
command = ["node", "keyboard.mjs", "shift+tab"]

[[actions]]
id = "shift-up"
title = "Keyboard: Shift + Up"
contexts = ["pane"]
command = ["node", "keyboard.mjs", "shift+up"]
