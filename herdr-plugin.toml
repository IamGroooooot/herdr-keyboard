id = "herdr-keyboard"
name = "Mobile Keyboard"
version = "0.4.0"
min_herdr_version = "0.9.0"
description = "Send hard-to-type key combinations from a mobile keyboard"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["npm", "ci"]

[[build]]
command = ["npm", "run", "build"]

[[actions]]
id = "open"
title = "Keyboard: Choose shortcut"
contexts = ["pane"]
command = ["node", "dist/cli.js", "open"]

[[panes]]
id = "picker"
title = "Mobile Keyboard"
placement = "popup"
width = "90%"
height = "80%"
command = ["node", "dist/cli.js"]

[[actions]]
id = "opt-down"
title = "Keyboard: Opt + Down"
contexts = ["pane"]
command = ["node", "dist/cli.js", "send", "alt+down"]

[[actions]]
id = "shift-tab"
title = "Keyboard: Shift + Tab"
contexts = ["pane"]
command = ["node", "dist/cli.js", "send", "shift+tab"]

[[actions]]
id = "shift-up"
title = "Keyboard: Shift + Up"
contexts = ["pane"]
command = ["node", "dist/cli.js", "send", "shift+up"]
